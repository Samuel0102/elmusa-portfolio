<header class="flex justify-between items-center text-neutral-300">
  <ng-container *transloco="let t">
    <h1 class="text-2xl font-normal tracking-wider md:text-3xl lg:text-4xl">{{ t('homeHeading') }}</h1>
  </ng-container>

  <div>
    <ul class="hidden items-center md:flex md:gap-x-5">
      @for (section of sectionList$ | async; track $index) {
        <li class="uppercase opacity-90 text-xl lg:text-2xl">
          @if (navigationMode === 'router') {
            <a class="hover:underline" [routerLink]="getRouterLink(section)" routerLinkActive="underline" [routerLinkActiveOptions]="{ exact: true }">
              {{ section.title }}
            </a>
          } @else {
            <a class="hover:underline" [href]="section.key">{{ section.title }}</a>
          }
        </li>
      }
      <app-language-selector></app-language-selector>
    </ul>

    <button [ngClass]="{ 'hidden': isMenuMobileOpened }"
            class="md:hidden"
            (click)="openMobileMenu()">
      <fa-icon size="lg" [icon]="mobileMenuIcon"></fa-icon>
    </button>

  </div>
</header>
