<section class="text-neutral-300 mt-10 mb-14" id="education">
  <app-section-heading title="educationSection.title"></app-section-heading>

  <div class="mt-14 grid gap-6 md:grid-cols-2 xl:w-10/12 xl:mx-auto">
    @for (education of educationList$ | async; track education.id; let i = $index) {
      <article class="education-card group relative overflow-hidden border border-white/10 bg-white/[0.03] p-6 md:p-8">
        <div class="absolute inset-x-0 top-0 h-1 bg-gradient-to-r from-neutral-300 via-white/60 to-transparent"></div>

        <div class="flex items-start justify-between gap-4">
          <div>
            <p class="text-xs uppercase tracking-[0.35em] text-white/45">0{{ i + 1 }}</p>
            <h4 class="mt-3 text-2xl uppercase tracking-wide md:text-3xl">{{ education.title }}</h4>
          </div>

          <span class="rounded-full border border-white/15 px-3 py-1 text-xs uppercase tracking-[0.3em] text-white/60 md:text-sm">
            {{ education.period }}
          </span>
        </div>

        <p class="mt-2 text-sm uppercase tracking-[0.25em] text-white/40 md:text-base">
          {{ education.origin }}
        </p>

        <p class="mt-6 text-sm leading-7 text-white/70 md:text-lg md:leading-8">
          {{ education.description }}
        </p>
      </article>
    }
  </div>
</section>
