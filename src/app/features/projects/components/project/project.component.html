<ng-container *transloco="let t;">
  <article
    class="group overflow-hidden border border-white/10 bg-white/[0.03] backdrop-blur-sm md:flex md:min-h-[22rem] 2xl:min-h-[26rem]"
    [ngClass]="index() % 2 === 1 ? 'md:flex-row-reverse' : 'md:flex-row'">
    <div class="relative aspect-[16/11] w-full overflow-hidden md:w-5/12 md:aspect-auto">
      <img
        class="h-full w-full object-cover transition duration-500 group-hover:scale-105"
        [ngSrc]="'assets/images/projects/' + mainProject().thumbnail"
        [alt]="mainProject().title + ' project thumbnail'"
        fill>
      <div class="absolute inset-0 bg-gradient-to-t from-black/75 via-black/15 to-transparent md:bg-gradient-to-r md:from-black/25 md:via-transparent"></div>
      <span class="absolute left-4 top-4 text-xs uppercase tracking-[0.35em] text-white/70 md:text-sm">
        0{{ index() + 1 }}
      </span>
    </div>

    <div class="flex flex-1 flex-col justify-between gap-6 p-6 md:w-7/12 md:p-10 xl:p-12">
      <div class="flex flex-col gap-3">
        <span class="text-xs uppercase tracking-[0.35em] text-white/45 md:text-sm">{{ t('selectedProject') }}</span>
        <h3 class="text-3xl uppercase tracking-wide md:text-5xl">{{ mainProject().title }}</h3>
        <span class="text-sm uppercase tracking-[0.3em] text-white/45 md:text-base">{{ mainProject().stack }}</span>
        <p class="max-w-2xl text-sm leading-7 text-white/70 md:text-lg md:leading-8">
          {{ mainProject().description }}
        </p>
      </div>

      <div class="flex flex-wrap gap-3 text-2xl md:text-3xl">
        @if (mainProject().deployLink) {
          <a class="inline-flex items-center gap-2 border border-white/15 px-4 py-2 transition hover:bg-white hover:text-black"
             [href]="mainProject().deployLink"
             aria-label="Open project">
            <fa-icon [icon]="linkIcons.deploy"></fa-icon>
          </a>
        }
        @if (mainProject().repoLink) {
          <a class="inline-flex items-center gap-2 border border-white/15 px-4 py-2 transition hover:bg-white hover:text-black"
             [href]="mainProject().repoLink"
             aria-label="Open repository">
            <fa-icon [icon]="linkIcons.repository"></fa-icon>
          </a>
        }
      </div>
    </div>
  </article>
</ng-container>
