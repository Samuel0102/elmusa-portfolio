<section class="text-neutral-300 flex flex-col" id="projects">
  <app-section-heading title="projectsSection.title"></app-section-heading>

  <div class="mt-14 flex flex-col gap-8 md:gap-12">
    @for (project of projectList$(); track project.id; let i = $index) {
      <app-project [mainProject]="project" [index]="i"></app-project>
    }
  </div>
</section>
